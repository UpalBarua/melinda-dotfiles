format = """$directory$git_branch$git_status$character"""
right_format = """$all"""

add_newline = false
palette = "tokyonight"

[directory]
style = 'bold tn_blue'
format = '[$path ]($style)'
truncation_length = 3
truncation_symbol = '…/'
truncate_to_repo = false

[directory.substitutions]
'~' = ""
'documents' = '󰈙'
'downloads' = ' '
'music' = ' '
'pictures' = ' '

[git_branch]
style = 'fg:tn_green'
symbol = ' '
format = '[on](fg:tn_foreground) [$symbol$branch ]($style)'

[git_status]
style = 'fg:tn_green'
format = '([$all_status$ahead_behind]($style) )'

[character]
error_symbol = "[ ](bold tn_red)"
success_symbol = "[ ](bold tn_blue)"

[palettes.tokyonight]
tn_bg = '#24283b'
tn_foreground = '#c0caf5'
tn_selection = '#2e3c64'
tn_red = '#f7768e'
tn_green = '#9ece6a'
tn_yellow = '#e0af68'
tn_blue = '#7aa2f7'
tn_magenta = '#bb9af7'
tn_cyan = '#7dcfff'
